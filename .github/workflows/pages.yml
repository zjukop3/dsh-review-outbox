name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-research-site.mjs'
      - 'docs/e2e/application-first-value.review.html'
      - 'indexnow.json'
      - 'scripts/indexnow-config.mjs'
      - 'scripts/submit-indexnow.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static research site
        run: PUBLIC_ORIGIN='https://zjukop3.github.io/dsh-review-outbox' node scripts/build-research-site.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # 第一次部署偶尔报「Found 0 artifact(s)」——同日 5 次里 2 次这样，日志自己
      # 都建议「稍后重试」。一个静态站点不该因为一次抓不到 artifact 就停在旧版本，
      # 所以失败后等 20 秒再试一次；重试那一步没有 continue-on-error，两次都失败时
      # job 才会真的红。
      - name: Deploy Pages (first attempt)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow about deployed URLs
        id: indexnow
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
      - name: Archive IndexNow submission receipt
        if: always() && steps.indexnow.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-${{ github.run_id }}
          path: docs/e2e/indexnow-submission.json
          if-no-files-found: warn
          retention-days: 30
